    <!-- Navigation Links -->

      <li>
        <a href="map.html">Map</a>

      <li>

    <!-- Navigation Actions -->

      <!-- Favourites -->

          <path

      <!-- Account -->
      <button class="btn-icon" aria-label="Account" title="Account" type="button"
        onclick="window.location.href='login.html'">

        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">

          <path
            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z" />

  <!-- ==================== END NAVBAR ==================== -->

  <!-- ════════════════════════════════════════════════════════
     HERO SECTION
════════════════════════════════════════════════════════ -->
  <section class="hero">
    <div class="hero-text">
      <h1>Find the Best Study<br>Spots Near You</h1>
      <p>Discover quiet libraries, cozy cafés, co-working spaces and university areas to help you focus and get more
        done.</p>

      <!-- Search Bar -->
      <div class="search-bar">
        <div class="search-input-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input type="text" id="searchInput" class="search-input"
            placeholder="Search study spaces, e.g. library, cafe…" autocomplete="off" />
        </div>
        <button class="btn-location" id="btnLocation">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
            <circle cx="12" cy="10" r="3" />
          </svg>
          Use My Location
        </button>
      </div>

      <!-- Category Chips (matching design image – no "All" chip) -->
      <div class="category-chips">
        <button class="chip active" data-type="library">
          <svg class="chip-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
          </svg>
          Libraries
        </button>
        <button class="chip" data-type="cafe">
          <svg class="chip-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8h1a4 4 0 0 1 0 8h-1" />
            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z" />
            <line x1="6" y1="1" x2="6" y2="4" />
            <line x1="10" y1="1" x2="10" y2="4" />
            <line x1="14" y1="1" x2="14" y2="4" />
          </svg> Cafés
        </button>
        <button class="chip" data-type="coworking">
          <svg class="chip-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="12" rx="2" />
            <line x1="2" y1="20" x2="22" y2="20" />
          </svg>
          Co-working Spaces
        </button>
        <button class="chip" data-type="university">
          <svg class="chip-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 10L12 5 2 10l10 5 10-5z" />
            <path d="M6 12v5c3 2 9 2 12 0v-5" />
            <line x1="22" y1="10" x2="22" y2="16" />
          </svg>
          University Areas
        </button>
      </div>
    </div>

    <!-- Hero Illustration – girl studying at desk (matches design image) -->
    <div class="hero-image">
      <img src="images/hero.jpg" alt="Person studying at a desk" loading="eager" />
    </div>
  </section>

  <!-- ════════════════════════════════════════════════════════
     POPULAR SPACES
════════════════════════════════════════════════════════ -->
  <section class="spaces-section">
    <div class="section-header">
      <h2>Popular Study Spaces</h2>
      <a href="explore.html" class="view-all-link">
        View All
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12" />
          <polyline points="12 5 19 12 12 19" />
        </svg>
      </a>
    </div>

    <div class="spaces-grid" id="spacesGrid">
      <div class="loading-state">
        <div class="spinner"></div>
        <span>Loading study spaces…</span>
      </div>
    </div>
  </section>

  <!-- ════════════════════════════════════════════════════════
     SCRIPTS
════════════════════════════════════════════════════════ -->
  <script src="JS/main.js"></script>
  <script>
    /* ── Config ─────────────────────────────────────────────── */
    const API_URL = 'php/get_spaces.php';
    let activeType = 'library';
    let searchQuery = '';
    let debounceTimer;

    /* ── Fallback images for popular study spots ── */
    const FALLBACK_IMAGES = [
      'images/national-library.jpg',
      'images/cafe-kumbuk.jpg',
      'images/hub-lanka.jpg',
      'images/uoc-library.jpg',
      'images/book-haven.jpg',
      'images/green-space.jpg',
      'images/library-cafe.jpg',
      'images/mind-space.jpg',
    ];

    /* ── Load & Render Spaces ────────────────────────────────── */
    async function loadSpaces() {
      const grid = document.getElementById('spacesGrid');
      grid.innerHTML = `<div class="loading-state"><div class="spinner"></div><span>Loading…</span></div>`;

      try {
        const params = new URLSearchParams({ limit: 8 });
        if (activeType) params.set('type', activeType);
        if (searchQuery) params.set('search', searchQuery);

        const res = await fetch(`${API_URL}?${params}`);
        const data = await res.json();

        if (!data.success) throw new Error('API error');

        if (data.spaces.length === 0) {
          grid.innerHTML = `<div class="empty-state">
        <p>😔 No study spaces found.</p>
        <button onclick="resetFilters()">Clear Filters</button>
      </div>`;
          return;
        }

        grid.innerHTML = data.spaces.map((s, i) => renderCard(s, i)).join('');

      } catch (err) {
        /* ── Show local placeholder cards when API is unavailable ── */
        grid.innerHTML = renderFallbackCards();
      }
    }

    /* ── Fallback Static Cards (shown without XAMPP) ── */
    function renderFallbackCards() {
      const cards = [
        { name: 'National Library', district: 'Colombo', rating: '4.8', reviews: '128', img: 'images/national-library.jpg', open: true },
        { name: 'Café Kumbuk', district: 'Colombo 05', rating: '4.5', reviews: '94', img: 'images/cafe-kumbuk.jpg', open: true },
        { name: 'Hub Lanka', district: 'Colombo 03', rating: '4.7', reviews: '76', img: 'images/hub-lanka.jpg', open: true },
        { name: 'National Library Colombo', district: 'Colombo', rating: '4.9', reviews: '150', img: 'images/uoc-library.jpg', open: true },
      ];
      return cards.map(c => `
  <article class="space-card">
    <div class="card-img-wrap">
      <img class="card-img" src="${c.img}" alt="${c.name}" loading="lazy"
           onerror="this.src='images/placeholder.svg'" />
    </div>
    <div class="card-body">
      <div class="card-location">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        ${c.district}
      </div>
      <h3 class="card-name">${c.name}</h3>
      <div class="card-footer">
        <div class="card-rating">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="#f5a623" stroke="none">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
          <strong>${c.rating}</strong>
          <span class="review-count">(${c.reviews})</span>
        </div>
        <span class="badge ${c.open ? 'badge-open' : 'badge-closed'}">${c.open ? 'Open Now' : 'Closed'}</span>
      </div>
    </div>
  </article>`).join('');
    }

    /* ── Card Template (from API) ───────────────────────────── */
    function renderCard(s, i) {
      const img = s.image_url ? escH(s.image_url) : (FALLBACK_IMAGES[i % FALLBACK_IMAGES.length] || 'images/placeholder.svg');
      const name = escH(s.name);
      const district = escH(s.district);
      const rating = parseFloat(s.rating).toFixed(1);
      const reviews = parseInt(s.total_reviews).toLocaleString();
      const open = s.is_open;

      return `
  <article class="space-card">
    <div class="card-img-wrap">
      <img class="card-img" src="${img}" alt="${name}" loading="lazy"
           onerror="this.src='images/placeholder.svg'" />
    </div>
    <div class="card-body">
      <div class="card-location">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        ${district}
      </div>
      <h3 class="card-name">${name}</h3>
      <div class="card-footer">
        <div class="card-rating">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="#f5a623" stroke="none">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
          <strong>${rating}</strong>
          <span class="review-count">(${reviews})</span>
        </div>
        <span class="badge ${open ? 'badge-open' : 'badge-closed'}">${open ? 'Open Now' : 'Closed'}</span>
      </div>
    </div>
  </article>`;
    }

    function escH(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /* ── Category Chips ──────────────────────────────────────── */
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        activeType = chip.dataset.type;
        loadSpaces();
      });
    });

    /* ── Search ──────────────────────────────────────────────── */
    document.getElementById('searchInput').addEventListener('input', e => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        searchQuery = e.target.value.trim();
        loadSpaces();
      }, 400);
    });

    /* ── Use My Location ─────────────────────────────────────── */
    document.getElementById('btnLocation').addEventListener('click', () => {
      if (!navigator.geolocation) { alert('Geolocation not supported.'); return; }
      navigator.geolocation.getCurrentPosition(
        pos => alert(`Your location: ${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`),
        () => alert('Unable to get your location.')
      );
    });

    /* ── Reset ───────────────────────────────────────────────── */
    function resetFilters() {
      activeType = 'library'; searchQuery = '';
      document.getElementById('searchInput').value = '';
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      document.querySelector('.chip[data-type="library"]').classList.add('active');
      loadSpaces();
    }

    /* ── Init ────────────────────────────────────────────────── */
    loadSpaces();
  </script>

</body>

</html>
