<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | StudySpot</title>
  <link rel="stylesheet" href="CSS/base.css" />
  <link rel="stylesheet" href="CSS/forgot-password.css" />
  <style>
    /* Inlined styling mirroring login.html & forgot-password.html */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: var(--font-family, 'Inter', sans-serif);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 24px 80px 24px 24px;
      background-image:
        linear-gradient(135deg, rgba(0, 0, 0, 0.35) 0%, rgba(0, 0, 0, 0.15) 100%),
        url('images/auth-bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #ffffff;
    }

    .auth-card {
      width: 100%;
      max-width: 400px;
      background: rgba(18, 20, 28, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 40px 36px 36px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
      color: #ffffff;
    }

    .auth-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-bottom: 24px;
      text-align: center;
    }

    .auth-logo img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .auth-logo .brand-name {
      font-size: var(--fs-lg, 22px);
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .auth-logo .brand-name .study {
      color: #ffffff;
    }

    .auth-logo .brand-name .spot {
      color: #3ddc84;
    }

    .auth-logo .tagline {
      font-size: var(--fs-xs, 12px);
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 0.2px;
    }

    .auth-title {
      font-size: var(--fs-lg, 22px);
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
      text-align: left;
    }

    .auth-subtitle {
      font-size: var(--fs-sm, 14px);
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.45;
      margin-bottom: 22px;
      text-align: left;
    }

    .alert-banner {
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 18px;
      font-size: var(--fs-sm, 14px);
      line-height: 1.45;
      display: none;
    }

    .alert-banner.show {
      display: block;
      animation: fadeIn 0.25s ease-in-out;
    }

    .alert-banner.error {
      background: rgba(220, 53, 69, 0.16);
      color: #ff7b7b;
      border: 1px solid rgba(220, 53, 69, 0.35);
    }

    .alert-banner.success {
      background: rgba(61, 220, 132, 0.12);
      color: #3ddc84;
      border: 1px solid rgba(61, 220, 132, 0.3);
    }

    .input-group {
      position: relative;
      margin-bottom: 16px;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.45);
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 13px 44px 13px 44px;
      font-size: var(--fs-sm, 14px);
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }

    .form-input::placeholder {
      color: rgba(255, 255, 255, 0.38);
    }

    .form-input:focus {
      border-color: #3ddc84;
      background: rgba(61, 220, 132, 0.06);
      box-shadow: 0 0 0 3px rgba(61, 220, 132, 0.18);
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.45);
      display: flex;
      align-items: center;
      padding: 4px;
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: rgba(255, 255, 255, 0.8);
    }

    .btn-reset {
      width: 100%;
      background: linear-gradient(135deg, #2f8c47, #246e38);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 13px 16px;
      font-size: var(--fs-base, 16px);
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      letter-spacing: 0.2px;
      margin-top: 18px;
    }

    .btn-reset:hover {
      background: linear-gradient(135deg, #359d50, #2a7c3f);
      box-shadow: 0 6px 18px rgba(46, 133, 64, 0.35);
    }

    .btn-reset:active {
      transform: scale(0.98);
    }

    .back-link-wrapper {
      text-align: center;
      margin-top: 20px;
    }

    .back-link {
      font-size: var(--fs-sm, 14px);
      color: #3ddc84;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 680px) {
      body {
        justify-content: center;
        padding: 16px;
      }
      .auth-card {
        padding: 32px 24px;
        border-radius: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="auth-card">

    <div class="auth-logo">
      <img src="images/logo.png" alt="StudySpot Logo" />
      <span class="brand-name">
        <span class="study">Study</span><span class="spot">Spot</span>
      </span>
      <span class="tagline">Find Your Perfect Study Space</span>
    </div>

    <h1 class="auth-title">Reset password</h1>
    <p class="auth-subtitle">Create a new password for your account.</p>

    <div class="alert-banner error" id="errorMessage" role="alert"></div>
    <div class="alert-banner success" id="successMessage" role="status"></div>

    <form action="php/reset_password.php" method="POST" id="resetForm" novalidate>
      <input type="hidden" name="token" id="token" />
      <input type="hidden" name="email" id="email" />

      <!-- New Password -->
      <div class="input-group">
        <span class="input-icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </span>
        <input class="form-input" type="password" id="new_password" name="new_password" placeholder="New password (min 6 characters)" required autocomplete="new-password" />
        <button type="button" class="toggle-password" onclick="togglePass('new_password', this)" aria-label="Toggle password visibility">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </div>

      <!-- Confirm Password -->
      <div class="input-group">
        <span class="input-icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </span>
        <input class="form-input" type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password" required autocomplete="new-password" />
        <button type="button" class="toggle-password" onclick="togglePass('confirm_password', this)" aria-label="Toggle password visibility">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </div>

      <button type="submit" class="btn-reset" id="btnSubmit">
        <span id="btnText">Update password</span>
      </button>

      <div class="back-link-wrapper">
        <a href="login.html" class="back-link">Back to login</a>
      </div>
    </form>

  </div>

  <script>
    // Extract token and email from query params
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    const email = params.get('email') || '';

    document.getElementById('token').value = token;
    document.getElementById('email').value = email;

    const errorBox = document.getElementById('errorMessage');
    const successBox = document.getElementById('successMessage');
    const resetForm = document.getElementById('resetForm');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnText = document.getElementById('btnText');

    if (!token || !email) {
      errorBox.textContent = 'Invalid or missing password reset link. Please request a new one.';
      errorBox.classList.add('show');
      btnSubmit.disabled = true;
    }

    function togglePass(inputId, btn) {
      const input = document.getElementById(inputId);
      const isPass = input.type === 'password';
      input.type = isPass ? 'text' : 'password';
      btn.innerHTML = isPass
        ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
             <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
             <line x1="1" y1="1" x2="23" y2="23"/>
           </svg>`
        : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
             <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
             <circle cx="12" cy="12" r="3"/>
           </svg>`;
    }

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const p1 = document.getElementById('new_password').value;
      const p2 = document.getElementById('confirm_password').value;

      if (!p1 || !p2) {
        errorBox.textContent = 'Please fill in both password fields.';
        errorBox.classList.add('show');
        return;
      }

      if (p1.length < 6) {
        errorBox.textContent = 'Password must be at least 6 characters long.';
        errorBox.classList.add('show');
        return;
      }

      if (p1 !== p2) {
        errorBox.textContent = 'Passwords do not match. Please try again.';
        errorBox.classList.add('show');
        return;
      }

      btnSubmit.disabled = true;
      btnText.textContent = 'Updating password...';

      try {
        const resp = await fetch('php/reset_password.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-Requested-With': 'XMLHttpRequest'
          },
          body: new URLSearchParams({
            token: token,
            email: email,
            new_password: p1,
            confirm_password: p2
          })
        });

        const data = await resp.json();

        if (data.success) {
          errorBox.classList.remove('show');
          successBox.innerHTML = `
            <div><strong>${data.message || 'Password updated successfully!'}</strong></div>
            <div style="margin-top: 10px;">
              <a href="login.html" class="demo-reset-link">Proceed to Login &rarr;</a>
            </div>
          `;
          successBox.classList.add('show');
          resetForm.style.display = 'none';
        } else {
          errorBox.textContent = data.error || 'Failed to update password.';
          errorBox.classList.add('show');
          btnSubmit.disabled = false;
          btnText.textContent = 'Update password';
        }
      } catch (err) {
        resetForm.submit();
      }
    });
  </script>

</body>

</html>
