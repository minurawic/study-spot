<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="CSS/base.css" />
  <link rel="stylesheet" href="CSS/explore.css" />
  <link rel="stylesheet" href="CSS/navbar.css" />
</head>

<body>

  â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• -->
  <nav class="navbar">
    <!-- Logo -->
    <a href="index.html" class="nav-logo">
      <img src="images/logo.png" alt="StudySpot Logo" />
      <span><span class="study">Study</span><span class="spot">Spot</span></span>
    </a>

    <!-- Nav Links -->
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="explore.html" class="active">Explore</a></li>
      <li><a href="map.html">Map</a></li>
      <li><a href="help.html">About Us</a></li>
    </ul>

    <!-- Actions -->
    <div class="nav-actions">
      <button class="btn-icon" aria-label="Favourites" title="Favourites">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path
            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
        </svg>
      </button>
      <button class="btn-icon" aria-label="Account" title="Account" onclick="window.location.href='login.html'">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z" />
        </svg>

  </nav>

  <!-- ════════════════════════════════════════════════════════════
       MAIN PAGE CONTAINER
  ════════════════════════════════════════════════════════════ -->
  <main class="page-container">

    <!-- Header Section -->
    <header class="page-header">
      <h1>Explore Study Spaces</h1>
      <p>Find the best places to study near you</p>
    </header>

    <!-- Search & Location Row -->
    <section class="search-row">
      <div class="search-bar-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input type="search" id="searchInput" class="search-bar-input"
          placeholder="Search location, place, name or type..." autocomplete="off" />
      </div>

      <!-- Location Chip -->
      <button class="location-chip-btn" id="locationBtn" title="Current Location">
        <span>Colombo, Sri Lanka</span>
      </button>
    </section>

    <!-- Explore Layout: Sidebar Filters + Cards List -->
    <div class="explore-layout">

      <!-- ── Left Filters Sidebar ── -->
      <aside class="filters-sidebar">

        <!-- Header -->
        <div class="filters-header">
          <h3>Filters</h3>
          <button type="button" class="btn-clear-all" id="clearAllBtn">Clear All</button>
        </div>

        <!-- Distance Filter -->
        <div class="filter-group">
          <div class="filter-title">Distance</div>
          <div class="distance-slider-wrap">
            <div class="distance-labels">
              <span>1km</span>
              <span id="distanceVal">20km</span>
            </div>
            <input type="range" id="distanceSlider" class="range-slider" min="1" max="10" step="0.5" value="10" />
            <div class="distance-labels" style="justify-content:flex-end;">
              <span>10km</span>
            </div>
          </div>
        </div>

        <!-- Type Filter -->
        <div class="filter-group">
          <div class="filter-title">Type</div>
          <div class="filter-options">
            <label class="checkbox-label">
              <input type="checkbox" name="filter_type" value="library" />
              <span>Libraries</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="filter_type" value="cafe" />
              <span>Cafes</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="filter_type" value="coworking" />
              <span>Co-working Spaces</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="filter_type" value="university" />
              <span>University Areas</span>
            </label>
          </div>
        </div>

        <!-- Wi-Fi Filter -->
        <div class="filter-group">
          <div class="filter-title">Wi-Fi</div>
          <div class="filter-options">
            <label class="radio-label">
              <input type="radio" name="filter_wifi" value="any" checked />
              <span>Any</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="filter_wifi" value="free" />
              <span>Free Wi-Fi</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="filter_wifi" value="paid" />
              <span>Paid Wi-Fi</span>
            </label>
          </div>
        </div>

        <!-- Noise Level Filter -->
        <div class="filter-group">
          <div class="filter-title">Noise Level</div>
          <div class="filter-options">
            <label class="checkbox-label">
              <input type="checkbox" name="filter_noise" value="very_quiet" />
              <span>Very Quiet</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="filter_noise" value="quiet" />
              <span>Quiet</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="filter_noise" value="moderate" />
              <span>Modarate</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="filter_noise" value="lively" />
              <span>Lively</span>
            </label>
          </div>
        </div>

        <!-- Cost Filter -->
        <div class="filter-group">
          <div class="filter-cost-header">
            <span class="filter-title">Cost</span>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
          </div>
          <div class="filter-options">
            <label class="radio-label">
              <input type="radio" name="filter_cost" value="any" checked />
              <span>Any</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="filter_cost" value="free" />
              <span>Free</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="filter_cost" value="1-200" />
              <span>LKR 1-200</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="filter_cost" value="201-500" />
              <span>LKR 201-500</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="filter_cost" value="500+" />
              <span>LKR 500+</span>
            </label>
          </div>
        </div>

        <!-- Opening Now Filter Box -->
        <div class="opening-now-box">
          <label class="opening-now-label">
            <input type="checkbox" id="openNowCheck" class="checkbox-label" />
            <span>Opening Now</span>
          </label>
        </div>

      </aside>

      <!-- ── Right Results Section ── -->
      <section class="results-area">

        <!-- Top bar: Count & Sort Dropdown -->
        <div class="results-topbar">
          <div class="results-count" id="resultsCount">42 results found</div>
          <div class="sort-dropdown-wrap">
            <select class="sort-select" id="sortSelect">
              <option value="recommended">Sort by: Recommended</option>
              <option value="rating">Sort by: Highest Rated</option>
              <option value="distance">Sort by: Nearest First</option>
              <option value="price_asc">Sort by: Lowest Price</option>
            </select>
          </div>
        </div>

        <!-- Space Cards Container (Populated via JS / MySQL) -->
        <div class="space-cards-list" id="spacesList">
          <!-- Dynamically populated -->
        </div>

        <!-- Pagination Bar -->
        <div class="pagination-wrap" id="paginationWrap">
          <button class="page-btn active">1</button>
          <button class="page-btn">2</button>
          <button class="page-btn">3</button>
          <button class="page-btn">4</button>
          <button class="page-btn">5</button>
          <span class="page-btn dots">...</span>
          <button class="page-btn">&gt;&gt;</button>
        </div>

      </section>

    </div>

  </main>

  <script src="JS/explore.js"></script>
</body>

</html>
