<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Confirmed – StudySpot</title>
  <link rel="stylesheet" href="CSS/base.css" />
  <link rel="stylesheet" href="CSS/navbar.css" />
  <link rel="stylesheet" href="CSS/booking-details.css" />
  <link rel="stylesheet" href="CSS/confirmation.css" />
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar">
    <!-- Logo -->
    <a href="index.html" class="nav-logo">
      <img src="images/logo.png" alt="StudySpot Logo" />
      <span><span class="study">Study</span><span class="spot">Spot</span></span>
    </a>

    <!-- Nav Links -->
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="explore.html">Explore</a></li>
      <li><a href="map.html">Map</a></li>
      <li><a href="help.html">About Us</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>

    <!-- Actions -->
    <div class="nav-actions">
      <!-- Favourites Button -->
      <button class="btn-icon" aria-label="Favourites" title="Favourites" type="button"
        onclick="window.location.href='favourites.html'">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path
            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
        </svg>
      </button>

      <!-- Account Button -->
      <button class="btn-icon" aria-label="Account" title="Account" type="button"
        onclick="window.location.href='my-bookings.html'">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z" />
        </svg>
      </button>
    </div>
  </nav>

  <!-- MAIN CONFIRMATION CONTENT -->
  <main class="confirmation-container">

    <!-- Celebration Header: Green Checkmark & Party Poppers -->
    <section class="celebration-hero">
      <div class="celebration-icon-wrap">

        <!-- Left Party Popper -->
        <div class="party-popper party-popper-left" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 38 L22 24 L32 34 Z" fill="#F59E0B" />
            <path d="M10 36 L16 30 L20 34 L14 40 Z" fill="#EF4444" />
            <path d="M16 30 L22 24 L26 28 L20 34 Z" fill="#3B82F6" />
            <path d="M24 20 C26 14, 32 16, 34 10" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" />
            <path d="M28 24 C34 22, 36 16, 42 18" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" />
            <path d="M20 18 C18 12, 22 8, 26 6" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" />
            <circle cx="26" cy="14" r="2" fill="#EAB308" />
            <circle cx="36" cy="12" r="2" fill="#EC4899" />
            <circle cx="40" cy="24" r="2" fill="#8B5CF6" />
            <circle cx="32" cy="6" r="1.5" fill="#06B6D4" />
            <circle cx="18" cy="8" r="1.5" fill="#F97316" />
          </svg>
        </div>

        <!-- Center Green Checkmark Badge -->
        <div class="success-checkmark-circle" role="img" aria-label="Success checkmark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"
            stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>

        <!-- Right Party Popper -->
        <div class="party-popper party-popper-right" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 38 L22 24 L32 34 Z" fill="#F59E0B" />
            <path d="M10 36 L16 30 L20 34 L14 40 Z" fill="#EF4444" />
            <path d="M16 30 L22 24 L26 28 L20 34 Z" fill="#3B82F6" />
            <path d="M24 20 C26 14, 32 16, 34 10" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" />
            <path d="M28 24 C34 22, 36 16, 42 18" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" />
            <path d="M20 18 C18 12, 22 8, 26 6" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" />
            <circle cx="26" cy="14" r="2" fill="#EAB308" />
            <circle cx="36" cy="12" r="2" fill="#EC4899" />
            <circle cx="40" cy="24" r="2" fill="#8B5CF6" />
            <circle cx="32" cy="6" r="1.5" fill="#06B6D4" />
            <circle cx="18" cy="8" r="1.5" fill="#F97316" />
          </svg>
        </div>

      </div>

      <h1 class="confirmation-title">Booking Confirmed!</h1>
      <p class="confirmation-subtitle">Your spot has been successfully booked.</p>
    </section>

    <!-- Booking Summary Card -->
    <article class="booking-summary-card" aria-label="Booking Summary">

      <!-- Place Thumbnail Image -->
      <div class="card-thumb-wrap">
        <img id="confirmImg" src="images/library-cafe.jpg" alt="The Library Cafe" class="card-thumb-img"
          onerror="this.onerror=null; this.src='images/placeholder.svg'" />
      </div>

      <!-- Booking Details -->
      <div class="card-details-wrap">
        <h2 class="place-name" id="confirmPlaceName">The Library Cafe</h2>
        <div class="place-city" id="confirmPlaceCity">Kandy</div>

        <div class="details-table">
          <div class="detail-row">
            <span class="detail-label">Date</span>
            <span class="detail-value" id="confirmDate">2026-09-12</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Time</span>
            <span class="detail-value" id="confirmTime">10.00 AM - 12.00 PM</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">People</span>
            <span class="detail-value" id="confirmPeople">1</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Total Price</span>
            <span class="detail-value" id="confirmPrice">Rs. 500</span>
          </div>
        </div>
      </div>

    </article>

    <!-- Action Buttons -->
    <div class="confirmation-actions">
      <a href="my-bookings.html" class="btn-confirm-primary" id="btnViewBookings">View My Bookings</a>
      <a href="index.html" class="btn-confirm-secondary" id="btnBackHome">Back to Home</a>
    </div>

  </main>

  <script src="JS/confirmation.js"></script>
  <script src="JS/navbar.js"></script>
</body>

</html>
