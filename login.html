<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | StudySpot</title>
  <link rel="stylesheet" href="CSS/style.css" />
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">

      <!-- Logo -->
      <div class="auth-logo">
        <span class="logo-icon">🏠</span>
        <span><span class="study">Study</span><span class="spot">Spot</span></span>
      </div>

      <!-- Heading -->
      <h1 class="auth-title">Welcome Back!</h1>
      <p class="auth-subtitle">Login to continue</p>

      <!-- Error message (shown via JS) -->
      <div class="error-message" id="errorMessage" role="alert"></div>

      <!-- Login Form -->
      <form action="php/login.php" method="POST" id="loginForm" novalidate>

        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input
            class="form-input"
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
            autocomplete="email"
          />
        </div>

        <!-- Password -->
        <div class="form-group">
          <div class="form-label-row">
            <label class="form-label" for="password">Password</label>
            <a href="#" class="forgot-link">Forgot Password?</a>
          </div>
          <div class="password-wrapper">
            <input
              class="form-input"
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            />
            <button
              type="button"
              class="toggle-password"
              onclick="togglePassword(this)"
              aria-label="Toggle password visibility"
            >
              <!-- Closed-eye SVG (default) -->
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary">Login</button>
      </form>

      <!-- Divider -->
      <div class="divider">or continue with</div>

      <!-- Social Buttons -->
      <div class="social-btns">
        <button type="button" class="btn-social">
          <!-- Google SVG -->
          <svg width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <path fill="#EA4335" d="M24 9.5c3.15 0 5.67 1.08 7.56 2.85l5.64-5.64C33.69 3.52 29.18 1.5 24 1.5 14.87 1.5 7.24 7.1 4.07 14.97l6.56 5.1C12.13 13.67 17.54 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.5 24c0-1.64-.15-3.22-.42-4.75H24v9h12.71C35.73 32.3 33 35.38 29.27 37.3l6.45 5.01C40.89 38.36 46.5 31.79 46.5 24z"/>
            <path fill="#FBBC05" d="M10.63 28.93A14.5 14.5 0 0 1 9.5 24c0-1.71.3-3.36.83-4.93l-6.56-5.1A22.48 22.48 0 0 0 1.5 24c0 3.63.87 7.06 2.4 10.1l6.73-5.17z"/>
            <path fill="#34A853" d="M24 46.5c5.18 0 9.53-1.72 12.72-4.69l-6.45-5.01c-1.79 1.2-4.07 1.9-6.27 1.9-6.46 0-11.87-4.17-13.37-9.77l-6.73 5.17C7.24 40.9 14.87 46.5 24 46.5z"/>
          </svg>
          Google
        </button>
        <button type="button" class="btn-social">
          <!-- Facebook SVG -->
          <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="#1877F2" d="M24 12.073C24 5.404 18.627 0 12 0S0 5.404 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97h-1.513c-1.491 0-1.956.93-1.956 1.885v2.268h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/>
          </svg>
          Facebook
        </button>
      </div>

      <!-- Footer link -->
      <p class="auth-footer">
        Don't have an account?
        <a href="register.html" class="auth-link">Sign up</a>
      </p>

    </div><!-- /.auth-card -->
  </div><!-- /.auth-container -->

  <script src="JS/main.js"></script>
</body>
</html>
