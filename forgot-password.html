<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | StudySpot</title>
  <link rel="stylesheet" href="CSS/base.css" />
  <link rel="stylesheet" href="CSS/forgot-password.css" />
  <style>
    /* Inlined styling mirroring login.html & register.html architecture */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: var(--font-family, 'Inter', sans-serif);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 24px 80px 24px 24px;
      background-image:
        linear-gradient(135deg, rgba(0, 0, 0, 0.35) 0%, rgba(0, 0, 0, 0.15) 100%),
        url('images/auth-bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #ffffff;
    }

    /* ── Card ── */
    .auth-card {
      width: 100%;
      max-width: 400px;
      background: rgba(18, 20, 28, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 40px 36px 36px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
      color: #ffffff;
    }

    /* ── Logo ── */
    .auth-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-bottom: 24px;
      text-align: center;
    }

    .auth-logo img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .auth-logo .brand-name {
      font-size: var(--fs-lg, 22px);
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .auth-logo .brand-name .study {
      color: #ffffff;
    }

    .auth-logo .brand-name .spot {
      color: #3ddc84;
    }

    .auth-logo .tagline {
      font-size: var(--fs-xs, 12px);
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 0.2px;
    }

    /* ── Heading ── */
    .auth-title {
      font-size: var(--fs-lg, 22px);
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
      text-align: left;
    }

    .auth-subtitle {
      font-size: var(--fs-sm, 14px);
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.45;
      margin-bottom: 22px;
      text-align: left;
    }

    /* ── Alerts ── */
    .alert-banner {
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 18px;
      font-size: var(--fs-sm, 14px);
      line-height: 1.45;
      display: none;
    }

    .alert-banner.show {
      display: block;
      animation: fadeIn 0.25s ease-in-out;
    }

    .alert-banner.error {
      background: rgba(220, 53, 69, 0.16);
      color: #ff7b7b;
      border: 1px solid rgba(220, 53, 69, 0.35);
    }

    .alert-banner.success {
      background: rgba(61, 220, 132, 0.12);
      color: #3ddc84;
      border: 1px solid rgba(61, 220, 132, 0.3);
    }

    .demo-link-container {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed rgba(61, 220, 132, 0.3);
      font-size: var(--fs-xs, 12px);
      color: rgba(255, 255, 255, 0.85);
    }

    .demo-reset-link {
      color: #ffffff;
      background: #2e8540;
      padding: 6px 12px;
      border-radius: 6px;
      display: inline-block;
      margin-top: 6px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s;
    }

    .demo-reset-link:hover {
      background: #39a350;
    }

    /* ── Input Fields ── */
    .input-group {
      position: relative;
      margin-bottom: 16px;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 13px 16px 13px 44px;
      font-size: var(--fs-sm, 14px);
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }

    .form-input::placeholder {
      color: rgba(255, 255, 255, 0.38);
    }

    .form-input:focus {
      border-color: #3ddc84;
      background: rgba(61, 220, 132, 0.06);
      box-shadow: 0 0 0 3px rgba(61, 220, 132, 0.18);
    }

    .form-input.input-error {
      border-color: #ff6b6b;
      background: rgba(255, 107, 107, 0.06);
    }

    /* ── Reset Button ── */
    .btn-reset {
      width: 100%;
      background: #2e8540;
      background: linear-gradient(135deg, #2f8c47, #246e38);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 13px 16px;
      font-size: var(--fs-base, 16px);
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      letter-spacing: 0.2px;
      margin-top: 18px;
    }

    .btn-reset:hover {
      background: linear-gradient(135deg, #359d50, #2a7c3f);
      box-shadow: 0 6px 18px rgba(46, 133, 64, 0.35);
    }

    .btn-reset:active {
      transform: scale(0.98);
    }

    .btn-reset:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    /* Spinner */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
    }

    .btn-reset.loading .spinner {
      display: inline-block;
    }

    .btn-reset.loading .btn-text {
      opacity: 0.8;
    }

    /* ── Back to Login ── */
    .back-link-wrapper {
      text-align: center;
      margin-top: 20px;
    }

    .back-link {
      font-size: var(--fs-sm, 14px);
      color: #3ddc84;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s, text-decoration 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .back-link:hover {
      text-decoration: underline;
      opacity: 0.88;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ── Responsive ── */
    @media (max-width: 680px) {
      body {
        justify-content: center;
        padding: 16px;
      }

      .auth-card {
        padding: 32px 24px;
        border-radius: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="auth-card">

    <!-- Logo & Brand Header -->
    <div class="auth-logo">
      <img src="images/logo.png" alt="StudySpot Logo" />
      <span class="brand-name">
        <span class="study">Study</span><span class="spot">Spot</span>
      </span>
      <span class="tagline">Find Your Perfect Study Space</span>
    </div>

    <!-- Heading & Instructions -->
    <h1 class="auth-title">Forgot your password?</h1>
    <p class="auth-subtitle">Enter the email you signed up with and we'll send you a link to reset it.</p>

    <!-- Error & Success Banners -->
    <div class="alert-banner error" id="errorMessage" role="alert"></div>
    <div class="alert-banner success" id="successMessage" role="status"></div>

    <!-- Form -->
    <form class="forgot-form" action="php/forgot_password.php" method="POST" id="forgotForm" novalidate>

      <!-- Email Address Input -->
      <div class="input-group">
        <span class="input-icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2" />
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
          </svg>
        </span>
        <input class="form-input" type="email" id="email" name="email" placeholder="Email address" required
          autocomplete="email" />
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-reset" id="btnSubmit">
        <span class="spinner" id="btnSpinner"></span>
        <span class="btn-text" id="btnText">Send reset link</span>
      </button>

      <!-- Back to login link -->
      <div class="back-link-wrapper">
        <a href="login.html" class="back-link">Back to login</a>
      </div>

    </form>

  </div>

  <script src="JS/main.js"></script>
  <script>
    const forgotForm = document.getElementById('forgotForm');
    const emailInput = document.getElementById('email');
    const btnSubmit  = document.getElementById('btnSubmit');
    const btnSpinner = document.getElementById('btnSpinner');
    const btnText    = document.getElementById('btnText');
    const errorBox   = document.getElementById('errorMessage');
    const successBox = document.getElementById('successMessage');

    // Display URL Query Error or Success Parameters (if navigated via GET)
    const urlParams = new URLSearchParams(window.location.search);
    const errorCode = urlParams.get('error');
    const isSuccess = urlParams.get('success');
    const paramEmail = urlParams.get('email');

    if (errorCode) {
      const errMap = {
        empty: 'Please enter your email address.',
        invalid_email: 'Please provide a valid email address.',
        not_found: 'No account found with this email address.',
        server_error: 'Something went wrong on the server. Please try again.',
      };
      showError(errMap[errorCode] || 'An error occurred. Please try again.');
    } else if (isSuccess) {
      showSuccess('A reset link has been sent to your email address' + (paramEmail ? ` (${paramEmail})` : '') + '. Please check your inbox.');
    }

    function showError(msg) {
      successBox.classList.remove('show');
      successBox.innerHTML = '';
      errorBox.textContent = msg;
      errorBox.classList.add('show');
      emailInput.classList.add('input-error');
    }

    function showSuccess(msg, resetLink) {
      errorBox.classList.remove('show');
      errorBox.textContent = '';
      emailInput.classList.remove('input-error');

      let html = `<div>${msg}</div>`;
      if (resetLink) {
        html += `
          <div class="demo-link-container">
            <div><strong>Demo / Direct Access:</strong></div>
            <a href="${resetLink}" class="demo-reset-link">Click here to set a new password &rarr;</a>
          </div>
        `;
      }
      successBox.innerHTML = html;
      successBox.classList.add('show');
    }

    // Email input listener to clear error state on typing
    emailInput.addEventListener('input', () => {
      emailInput.classList.remove('input-error');
      if (errorBox.classList.contains('show')) {
        errorBox.classList.remove('show');
      }
    });

    // Handle AJAX Submission
    forgotForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const emailVal = emailInput.value.trim();

      // Client-side quick validation
      if (!emailVal) {
        showError('Please enter your email address.');
        emailInput.focus();
        return;
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(emailVal)) {
        showError('Please enter a valid email address.');
        emailInput.focus();
        return;
      }

      // Set Loading State
      btnSubmit.disabled = true;
      btnSubmit.classList.add('loading');
      btnText.textContent = 'Sending link...';

      try {
        const response = await fetch('php/forgot_password.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-Requested-With': 'XMLHttpRequest'
          },
          body: new URLSearchParams({ email: emailVal })
        });

        const data = await response.json();

        if (data.success) {
          showSuccess(
            data.message || 'A password reset link has been sent to your email address.',
            data.reset_link || null
          );
          // Keep input or disable
          emailInput.disabled = true;
          btnSubmit.style.display = 'none';
        } else {
          showError(data.error || 'Unable to process reset request. Please check the email.');
        }

      } catch (err) {
        // Fallback: If fetch encounters network or unexpected error, submit traditionally
        console.warn('AJAX failed, falling back to standard POST form submit:', err);
        forgotForm.submit();
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.classList.remove('loading');
        btnText.textContent = 'Send reset link';
      }
    });
  </script>

</body>

</html>
