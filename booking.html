  <!-- ════════════════════════════════════════════════════════════
       MAIN BOOKING CONTAINER
  ════════════════════════════════════════════════════════════ -->
  <main class="booking-page-container">

    <div class="booking-grid">

      <!-- Left Column: Place Overview -->
      <section class="place-preview-card">
        <div class="place-img-wrap">
          <img id="placeImg" src="images/placeholder.svg" alt="" class="place-img"
            onerror="this.onerror=null; this.src='images/placeholder.svg'" />
        </div>

        <div class="place-meta-info">
          <h1 class="place-name" id="placeName">Loading…</h1>
          <div class="place-city" id="placeCity">&nbsp;</div>
          <div class="place-rating" id="placeRating">
            &nbsp;
          </div>
        </div>
      </section>

      <!-- Right Column: Booking Form -->
      <section class="booking-form-card">
        <h2 class="booking-title">Book Your Spot</h2>

        <div class="booking-form">

          <!-- Date Field -->
          <div class="booking-field">
            <label for="dateInput" class="booking-label">Date</label>
            <div class="booking-input-wrap">
              <input type="date" id="dateInput" class="booking-input" required />
            </div>
          </div>

          <!-- Start Time + End Time (side by side) -->
          <div class="booking-row">
            <div class="booking-field">
              <label for="startInput" class="booking-label">Start Time</label>
              <div class="booking-input-wrap">
                <input type="time" id="startInput" class="booking-input" required />
              </div>
            </div>

            <div class="booking-field">
              <label for="endInput" class="booking-label">End Time</label>
              <div class="booking-input-wrap">
                <input type="time" id="endInput" class="booking-input" required />
              </div>
            </div>
          </div>
          <div class="booking-error" id="timeError" role="alert" hidden></div>

          <!-- Number of People Field -->
          <div class="booking-field">
            <label class="booking-label">Number of People</label>
            <div class="stepper-wrap">
              <button type="button" class="btn-stepper" id="btnMinus" aria-label="Decrease people">&minus;</button>
              <span class="stepper-count" id="stepperCount">1</span>
              <button type="button" class="btn-stepper" id="btnPlus" aria-label="Increase people">&plus;</button>
            </div>
          </div>

          <!-- Total Price Row -->
          <div class="total-price-row">
            <span class="total-price-label">Total Price</span>
            <span class="total-price-amount" id="totalPriceAmount">–</span>
          </div>
          <div class="price-breakdown" id="priceBreakdown" hidden></div>

          <!-- Process to Payment Button -->
          <button type="button" class="btn-process" id="btnProcess" disabled>
            Process to Payment
          </button>

          <!-- Back Link -->
          <div class="back-link-bottom">
            <a href="space-detail.html" class="back-to-details" id="backToDetailsLink">
              <span class="back-arrow">&larr;</span>
              <span>Back to details</span>
            </a>
          </div>

        </div>
      </section>

    </div>

  </main>

  <!-- ════════════════════════════════════════════════════════════
       CONFIRMATION MODAL
  ════════════════════════════════════════════════════════════ -->
  <div class="booking-modal-overlay" id="bookingModal">
    <div class="booking-modal-card">
      <div class="modal-icon-circle">&#10003;</div>
      <h3 class="modal-title">Booking Confirmed!</h3>
      <p class="modal-subtitle">Your study spot has been reserved successfully.</p>

      <div class="modal-receipt-box">
        <div class="receipt-row">
          <span>Study Space:</span>
          <strong id="modalPlace"></strong>
        </div>
        <div class="receipt-row">
          <span>Date:</span>
          <strong id="modalDate">2026-10-01</strong>
        </div>
        <div class="receipt-row">
          <span>Time:</span>
          <strong id="modalTime">10:00 AM</strong>
        </div>
        <div class="receipt-row">
          <span>Guests:</span>
          <strong id="modalPeople">1 Person</strong>
        </div>
        <div class="receipt-row">
          <span>Total Paid:</span>
          <strong id="modalTotal">Rs. 500</strong>
        </div>
        <div class="receipt-row">
          <span>Reference:</span>
          <strong id="modalRef" style="color: #2D6A2D;">SS-100234</strong>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-modal-primary" id="btnCloseModal">Done</button>
      </div>
    </div>
  </div>

  <script src="JS/places-data.js"></script>
  <script src="JS/booking.js"></script>

</html>
