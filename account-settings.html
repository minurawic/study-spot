<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Settings – StudySpot</title>
  <link rel="stylesheet" href="CSS/base.css" />
  <link rel="stylesheet" href="CSS/navbar.css" />
  <link rel="stylesheet" href="CSS/account-settings.css" />
</head>
<body>

  <!-- ════════════════════════════════════════════════════════════
       TOP NAVBAR (Matches StudySpot Design)
  ════════════════════════════════════════════════════════════ -->
  <nav class="navbar" aria-label="Main Navigation">
    <!-- Brand / Logo -->
    <a href="index.html" class="nav-logo">
      <img src="images/logo.png" alt="StudySpot Logo" />
      <span><span class="study">Study</span><span class="spot">Spot</span></span>
    </a>

    <!-- Nav Links -->
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="explore.html">Explore</a></li>
      <li><a href="map.html">Map</a></li>
      <li><a href="help.html">About Us</a></li>
    </ul>

    <!-- Actions (Heart + Account Profile) -->
    <div class="nav-actions">
      <!-- Favorites Heart Button -->
      <button class="btn-icon" aria-label="Favorites" title="Favorites" type="button" onclick="window.location.href='favourites.html'">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
        </svg>
      </button>

      <!-- Account Profile Button -->
      <button class="btn-icon" aria-label="Account Settings" title="Account Settings" type="button" onclick="window.location.href='account-settings.html'">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z" />
        </svg>
      </button>
    </div>
  </nav>

  <!-- ════════════════════════════════════════════════════════════
       MAIN ACCOUNT SETTINGS CONTENT
  ════════════════════════════════════════════════════════════ -->
  <main class="settings-wrapper">
    <div class="settings-container">
      
      <!-- Page Heading -->
      <h1 class="settings-page-title">Account settings</h1>

      <div class="settings-layout">
        <!-- ── Left Sidebar Navigation ────────────────────────── -->
        <aside class="settings-sidebar" aria-label="Settings navigation">
          <ul class="sidebar-nav">
            <li>
              <button type="button" class="sidebar-item active" id="tabProfileDetails">
                Profile details
              </button>
            </li>
            <li>
              <button type="button" class="sidebar-item" id="tabPassword">
                Password
              </button>
            </li>
            <li>
              <a href="php/logout.php" class="sidebar-item logout-link" id="btnLogout">
                Log out
              </a>
            </li>
          </ul>
        </aside>

        <!-- ── Right Column Content Area ──────────────────────── -->
        <section class="settings-content">

          <!-- Card 1: Profile details -->
          <div class="settings-card" id="profileDetailsSection">
            <h2 class="card-title">Profile details</h2>

            <!-- Feedback Alert Notification -->
            <div id="profileAlert" class="alert-box" style="display: none;"></div>

            <form id="profileForm" autocomplete="off">
              <!-- Avatar Circle + Change Photo Button -->
              <div class="avatar-row">
                <div class="avatar-circle" id="userAvatarBadge" title="Profile picture">
                  <span id="avatarInitials">NP</span>
                  <img id="avatarImage" src="" alt="User avatar" style="display: none;" />
                </div>
                <input type="file" id="avatarFileInput" name="avatar" accept="image/*" style="display: none;" />
                <button type="button" class="btn-change-photo" id="btnChangePhoto">
                  Change photo
                </button>
              </div>

              <!-- Full Name Field -->
              <div class="form-group">
                <label for="fullName">Full name</label>
                <input
                  type="text"
                  id="fullName"
                  name="full_name"
                  value="Nimali Perera"
                  placeholder="Enter full name"
                  required
                />
              </div>

              <!-- Email Address Field -->
              <div class="form-group">
                <label for="emailAddress">Email address</label>
                <input
                  type="email"
                  id="emailAddress"
                  name="email"
                  value="nimali.perera@gmail.com"
                  placeholder="name@example.com"
                  required
                />
              </div>

              <!-- Save Changes Button -->
              <div class="form-action">
                <button type="submit" class="btn-primary" id="btnSaveProfile">
                  Save changes
                </button>
              </div>
            </form>
          </div>

          <!-- Card 2: Change password -->
          <div class="settings-card" id="changePasswordSection">
            <h2 class="card-title">Change password</h2>

            <!-- Feedback Alert Notification -->
            <div id="passwordAlert" class="alert-box" style="display: none;"></div>

            <form id="passwordForm" autocomplete="off">
              <!-- Current Password Field -->
              <div class="form-group">
                <label for="currentPassword">Current password</label>
                <input
                  type="password"
                  id="currentPassword"
                  name="current_password"
                  value="••••••••••"
                  placeholder="••••••••••"
                  required
                />
              </div>

              <!-- New Password & Confirm Password Row -->
              <div class="form-row-two-col">
                <div class="form-group">
                  <label for="newPassword">New password</label>
                  <input
                    type="password"
                    id="newPassword"
                    name="new_password"
                    placeholder="At least 6 characters"
                    minlength="6"
                    required
                  />
                </div>
                <div class="form-group">
                  <label for="confirmPassword">Confirm new password</label>
                  <input
                    type="password"
                    id="confirmPassword"
                    name="confirm_password"
                    placeholder="Re-enter new password"
                    required
                  />
                </div>
              </div>

              <!-- Update Password Button -->
              <div class="form-action">
                <button type="submit" class="btn-primary" id="btnUpdatePassword">
                  Update password
                </button>
              </div>
            </form>
          </div>

        </section>
      </div>

    </div>
  </main>

  <!-- Controller Script -->
  <script src="JS/account-settings.js"></script>
</body>
</html>
