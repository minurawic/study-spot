<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bookings – StudySpot</title>
  <link rel="stylesheet" href="CSS/base.css" />
  <link rel="stylesheet" href="CSS/navbar.css" />
  <link rel="stylesheet" href="CSS/my-bookings.css" />
</head>

<body>

  <!-- ════════════════════════════════════════════════════════════
       NAVBAR
  ════════════════════════════════════════════════════════════ -->
  <nav class="navbar">
    <!-- Logo -->
    <a href="index.html" class="nav-logo">
      <img src="images/logo.png" alt="StudySpot Logo" />
      <span><span class="study">Study</span><span class="spot">Spot</span></span>
    </a>

    <!-- Nav Links -->
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="explore.html">Explore</a></li>
      <li><a href="map.html">Map</a></li>
      <li><a href="help.html">About Us</a></li>
    </ul>

    <!-- Actions -->
    <div class="nav-actions">
      <!-- Favourites Button -->
      <button class="btn-icon" aria-label="Favourites" title="Favourites" type="button" onclick="window.location.href='favourites.html'">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path
            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
        </svg>
      </button>

      <!-- Account Button -->
      <button class="btn-icon" aria-label="Account" title="Account" type="button" onclick="window.location.href='my-bookings.html'">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z" />
        </svg>
      </button>
    </div>
  </nav>

  <!-- ════════════════════════════════════════════════════════════
       MAIN CONTENT: MY BOOKINGS
  ════════════════════════════════════════════════════════════ -->
  <main class="bookings-page-container">
    <h1 class="bookings-heading">My Bookings</h1>

    <!-- Bookings Tabs -->
    <nav class="bookings-tabs" aria-label="Booking Status Tabs">
      <button type="button" class="tab-btn active" id="tabUpcoming" aria-selected="true">
        Upcoming <span class="tab-count" id="countUpcoming">(2)</span>
      </button>
      <button type="button" class="tab-btn" id="tabCompleted" aria-selected="false">
        Completed <span class="tab-count" id="countCompleted">(3)</span>
      </button>
      <button type="button" class="tab-btn" id="tabCancelled" aria-selected="false">
        Cancelled <span class="tab-count" id="countCancelled">(1)</span>
      </button>
    </nav>

    <!-- Bookings List (Populated via MySQL / JS, with default SSR markup matching PNG) -->
    <section class="bookings-list" id="bookingsList" aria-label="Bookings List">

      <!-- Card 1: The Library Cafe -->
      <article class="booking-card" data-id="1">
        <div class="card-main-content">
          <div class="card-img-wrap">
            <a href="booking-details.html?id=1">
              <img src="images/library-cafe.jpg" alt="The Library Cafe" loading="lazy" onerror="this.onerror=null; this.src='images/national-library.jpg';" />
            </a>
          </div>
          <div class="card-info">
            <h2 class="card-title">
              <a href="booking-details.html?id=1">The Library Cafe</a>
            </h2>
            <div class="card-location">Kandy</div>
            <div class="card-meta-row" style="margin-bottom: 6px;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
              <span>2026-09-12&nbsp;&nbsp;10.00 AM - 12.00 PM</span>
            </div>
            <div class="card-meta-row">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
              </svg>
              <span>1 Peoples</span>
            </div>
          </div>
        </div>
        <div class="card-actions-col">
          <div class="status-badge upcoming">Upcoming</div>
          <a href="booking-details.html?id=1" class="btn-view-details">View Details</a>
        </div>
      </article>

      <!-- Card 2: Green Space -->
      <article class="booking-card" data-id="2">
        <div class="card-main-content">
          <div class="card-img-wrap">
            <a href="booking-details.html?id=2">
              <img src="images/green-space.jpg" alt="Green Space" loading="lazy" onerror="this.onerror=null; this.src='images/national-library.jpg';" />
            </a>
          </div>
          <div class="card-info">
            <h2 class="card-title">
              <a href="booking-details.html?id=2">Green Space</a>
            </h2>
            <div class="card-location">Kandy</div>
            <div class="card-meta-row" style="margin-bottom: 6px;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
              <span>2026-09-15&nbsp;&nbsp;02.00 PM - 04.00 PM</span>
            </div>
            <div class="card-meta-row">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
              </svg>
              <span>2 Peoples</span>
            </div>
          </div>
        </div>
        <div class="card-actions-col">
          <div class="status-badge upcoming">Upcoming</div>
          <a href="booking-details.html?id=2" class="btn-view-details">View Details</a>
        </div>
      </article>

    </section>
  </main>

  <script src="JS/my-bookings.js"></script>
</body>

</html>
