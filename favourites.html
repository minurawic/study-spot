<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Favourites – StudySpot</title>
  <link rel="stylesheet" href="CSS/base.css" />
  <link rel="stylesheet" href="CSS/navbar.css" />
  <link rel="stylesheet" href="CSS/favourites.css" />
</head>

<body>

  <!-- ════════════════════════════════════════════════════════════
       NAVBAR
  ════════════════════════════════════════════════════════════ -->
  <nav class="navbar">
    <!-- Logo -->
    <a href="index.html" class="nav-logo">
      <img src="images/logo.png" alt="StudySpot Logo" />
      <span><span class="study">Study</span><span class="spot">Spot</span></span>
    </a>

    <!-- Nav Links -->
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="explore.html">Explore</a></li>
      <li><a href="map.html">Map</a></li>
      <li><a href="help.html">About Us</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>

    <!-- Actions -->
    <div class="nav-actions">
      <!-- Favourites Button -->
      <button class="btn-icon" aria-label="Favourites" title="Favourites" type="button" onclick="window.location.href='favourites.html'">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path
            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
        </svg>
      </button>

      <!-- Account Button -->
      <button class="btn-icon" aria-label="Account" title="Account" type="button" onclick="navGoToProfile()">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z" />
        </svg>
      </button>
    </div>
  </nav>

  <!-- ════════════════════════════════════════════════════════════
       MAIN CONTENT: MY FAVOURITES
  ════════════════════════════════════════════════════════════ -->
  <main class="favourites-container">
    <h1 class="page-heading">My Favourites</h1>

    <!-- Favourites List (populated dynamically via DB / favourites.js) -->
    <section class="favourites-list" id="favouritesList" aria-label="Saved Study Spaces">
      <!-- Default SSR / Fallback markup matching PNG -->
      <article class="favourite-card" data-id="5">
        <div class="card-img-wrap">
          <a href="space-detail.html?id=5">
            <img src="images/library-cafe.jpg" alt="The Library Cafe" loading="lazy" onerror="this.src='images/national-library.jpg'">
          </a>
        </div>
        <div class="card-details">
          <h2 class="card-title">
            <a href="space-detail.html?id=5">The Library Cafe</a>
          </h2>
          <div class="card-location">Kandy</div>
          <div class="card-rating-wrap">
            <svg class="star-icon" viewBox="0 0 24 24">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            </svg>
            <span>4.8 (124)</span>
          </div>
        </div>
        <div class="card-actions">
          <button type="button" class="btn-fav-toggle" aria-label="Remove from favourites" title="Remove from favourites">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
            </svg>
          </button>
          <a href="space-detail.html?id=5" class="btn-view-space">View</a>
        </div>
      </article>

      <article class="favourite-card" data-id="6">
        <div class="card-img-wrap">
          <a href="space-detail.html?id=6">
            <img src="images/mind-space.jpg" alt="Mind Space" loading="lazy" onerror="this.src='images/national-library.jpg'">
          </a>
        </div>
        <div class="card-details">
          <h2 class="card-title">
            <a href="space-detail.html?id=6">Mind Space</a>
          </h2>
          <div class="card-location">Peradeniya</div>
          <div class="card-rating-wrap">
            <svg class="star-icon" viewBox="0 0 24 24">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            </svg>
            <span>4.7 (74)</span>
          </div>
        </div>
        <div class="card-actions">
          <button type="button" class="btn-fav-toggle" aria-label="Remove from favourites" title="Remove from favourites">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
            </svg>
          </button>
          <a href="space-detail.html?id=6" class="btn-view-space">View</a>
        </div>
      </article>

      <article class="favourite-card" data-id="7">
        <div class="card-img-wrap">
          <a href="space-detail.html?id=7">
            <img src="images/book-haven.jpg" alt="Book Haven" loading="lazy" onerror="this.src='images/national-library.jpg'">
          </a>
        </div>
        <div class="card-details">
          <h2 class="card-title">
            <a href="space-detail.html?id=7">Book Haven</a>
          </h2>
          <div class="card-location">Kandy</div>
          <div class="card-rating-wrap">
            <svg class="star-icon" viewBox="0 0 24 24">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            </svg>
            <span>4.5 (44)</span>
          </div>
        </div>
        <div class="card-actions">
          <button type="button" class="btn-fav-toggle" aria-label="Remove from favourites" title="Remove from favourites">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
            </svg>
          </button>
          <a href="space-detail.html?id=7" class="btn-view-space">View</a>
        </div>
      </article>
    </section>
  </main>

  <!-- ════════════════════════════════════════════════════════════
       UNDO TOAST NOTIFICATION
  ════════════════════════════════════════════════════════════ -->
  <div class="fav-toast" id="favToast" role="alert" aria-live="polite">
    <span id="favToastMsg">Removed from favourites</span>
    <button type="button" class="fav-toast-undo" id="favToastUndo">Undo</button>
  </div>

  <!-- Scripts -->
  <script src="JS/main.js"></script>
  <script src="JS/places-data.js"></script>
  <script src="JS/favourites.js"></script>
  <script src="JS/navbar.js"></script>
</body>

</html>
