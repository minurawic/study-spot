<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | StudySpot</title>
  <link rel="stylesheet" href="CSS/base.css" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 24px 80px 24px 24px;
      background-image:
        linear-gradient(135deg, rgba(0, 0, 0, 0.35) 0%, rgba(0, 0, 0, 0.15) 100%),
        url('images/auth-bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* ── Card ── */
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: rgba(18, 20, 28, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 36px 36px 32px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
      color: #ffffff;
    }

    /* ── Logo ── */
    .auth-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      margin-bottom: 6px;
    }

    .auth-logo img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .auth-logo .brand-name {
      font-size: var(--fs-lg);
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .auth-logo .brand-name .study {
      color: #ffffff;
    }

    .auth-logo .brand-name .spot {
      color: #3ddc84;
    }

    .auth-logo .tagline {
      font-size: var(--fs-xs);
      color: rgba(255, 255, 255, 0.5);
    }

    .logo-divider {
      width: 48px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #3ddc84, transparent);
      margin: 12px auto 20px;
      border-radius: 2px;
    }

    /* ── Heading ── */
    .auth-title {
      font-size: var(--fs-lg);
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .auth-subtitle {
      font-size: var(--fs-sm);
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 20px;
    }

    /* ── Error ── */
    .error-message {
      background: rgba(220, 53, 69, 0.15);
      color: #ff6b6b;
      border: 1px solid rgba(220, 53, 69, 0.3);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 14px;
      font-size: var(--fs-sm);
      display: none;
    }

    .error-message.show {
      display: block;
    }

    /* ── Input Groups ── */
    .input-group {
      position: relative;
      margin-bottom: 12px;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 13px 44px 13px 42px;
      font-size: var(--fs-sm);
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .form-input::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }

    .form-input:focus {
      border-color: #3ddc84;
      background: rgba(61, 220, 132, 0.06);
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      padding: 4px;
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: rgba(255, 255, 255, 0.7);
    }

    /* ── Sign Up Button ── */
    .btn-signup {
      width: 100%;
      background: linear-gradient(135deg, #3ddc84, #2db866);
      color: #0d1a10;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: var(--fs-base);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
      transition: opacity 0.2s, transform 0.15s;
      letter-spacing: 0.2px;
    }

    .btn-signup:hover {
      opacity: 0.9;
    }

    .btn-signup:active {
      transform: scale(0.98);
    }

    /* ── Divider ── */
    .or-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0;
      color: rgba(255, 255, 255, 0.3);
      font-size: var(--fs-xs);
      letter-spacing: 1px;
    }

    .or-divider::before,
    .or-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }

    /* ── Google Button ── */
    .btn-google {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 12px;
      font-size: var(--fs-sm);
      font-weight: 500;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn-google:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.22);
    }

    /* ── Footer ── */
    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: var(--fs-sm);
      color: rgba(255, 255, 255, 0.45);
    }

    .auth-link {
      color: #3ddc84;
      font-weight: 600;
      text-decoration: none;
      margin-left: 4px;
    }

    .auth-link:hover {
      text-decoration: underline;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      body {
        justify-content: center;
        padding: 16px;
      }

      .auth-card {
        padding: 28px 20px;
      }
    }
  </style>
</head>

<body>

  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo">
      <img src="images/logo.png" alt="StudySpot Logo" />
      <span class="brand-name">
        <span class="study">Study</span><span class="spot">Spot</span>
      </span>
      <span class="tagline">Find Your Perfect Study Space</span>
    </div>

    <div class="logo-divider"></div>

    <!-- Heading -->
    <h1 class="auth-title">Create Account</h1>
    <p class="auth-subtitle">Sign up to find your perfect study space</p>

    <!-- Error -->
    <div class="error-message" id="errorMessage" role="alert"></div>

    <!-- Form -->
    <form action="php/register.php" method="POST" id="registerForm" novalidate>

      <!-- Full Name -->
      <div class="input-group">
        <span class="input-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        </span>
        <input class="form-input" type="text" id="full_name" name="full_name" placeholder="Full Name" required
          autocomplete="name" />
      </div>

      <!-- Email -->
      <div class="input-group">
        <span class="input-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
            <polyline points="22,6 12,13 2,6" />
          </svg>
        </span>
        <input class="form-input" type="email" id="email" name="email" placeholder="Email Address" required
          autocomplete="email" />
      </div>

      <!-- Password -->
      <div class="input-group">
        <span class="input-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </span>
        <input class="form-input" type="password" id="password" name="password"
          placeholder="Password (min. 6 characters)" required autocomplete="new-password" />
        <button type="button" class="toggle-password" onclick="togglePassword(this)"
          aria-label="Toggle password visibility">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <path
              d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
            <line x1="1" y1="1" x2="23" y2="23" />
          </svg>
        </button>
      </div>

      <!-- Confirm Password -->
      <div class="input-group">
        <span class="input-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 11 12 14 22 4" />
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
          </svg>
        </span>
        <input class="form-input" type="password" id="confirm_password" name="confirm_password"
          placeholder="Confirm Password" required autocomplete="new-password" />
        <button type="button" class="toggle-password" onclick="togglePassword(this)"
          aria-label="Toggle confirm password visibility">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <path
              d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
            <line x1="1" y1="1" x2="23" y2="23" />
          </svg>
        </button>
      </div>

      <button type="submit" class="btn-signup">
        Create Account
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12" />
          <polyline points="12 5 19 12 12 19" />
        </svg>
      </button>

    </form>

    <!-- OR Divider -->
    <div class="or-divider">OR</div>

    <!-- Google -->
    <button type="button" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#EA4335"
          d="M24 9.5c3.15 0 5.67 1.08 7.56 2.85l5.64-5.64C33.69 3.52 29.18 1.5 24 1.5 14.87 1.5 7.24 7.1 4.07 14.97l6.56 5.1C12.13 13.67 17.54 9.5 24 9.5z" />
        <path fill="#4285F4"
          d="M46.5 24c0-1.64-.15-3.22-.42-4.75H24v9h12.71C35.73 32.3 33 35.38 29.27 37.3l6.45 5.01C40.89 38.36 46.5 31.79 46.5 24z" />
        <path fill="#FBBC05"
          d="M10.63 28.93A14.5 14.5 0 0 1 9.5 24c0-1.71.3-3.36.83-4.93l-6.56-5.1A22.48 22.48 0 0 0 1.5 24c0 3.63.87 7.06 2.4 10.1l6.73-5.17z" />
        <path fill="#34A853"
          d="M24 46.5c5.18 0 9.53-1.72 12.72-4.69l-6.45-5.01c-1.79 1.2-4.07 1.9-6.27 1.9-6.46 0-11.87-4.17-13.37-9.77l-6.73 5.17C7.24 40.9 14.87 46.5 24 46.5z" />
      </svg>
      Continue with Google
    </button>

    <!-- Footer -->
    <p class="auth-footer">
      Already have an account?
      <a href="login.html" class="auth-link">Login</a>
    </p>

  </div>

  <script src="JS/main.js"></script>
  <script>
    // ── Password Toggle ──
    function togglePassword(btn) {
      const input = btn.closest('.input-group').querySelector('input');
      const isPass = input.type === 'password';
      input.type = isPass ? 'text' : 'password';
      btn.innerHTML = isPass
        ? `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2">
             <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
             <circle cx="12" cy="12" r="3"/>
           </svg>`
        : `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2">
             <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
             <line x1="1" y1="1" x2="23" y2="23"/>
           </svg>`;
    }

    // ── Password Match Validation ──
    document.getElementById('registerForm').addEventListener('submit', function (e) {
      const pw = document.getElementById('password').value;
      const cpw = document.getElementById('confirm_password').value;
      if (pw !== cpw) {
        e.preventDefault();
        const banner = document.getElementById('errorMessage');
        banner.textContent = 'Passwords do not match. Please try again.';
        banner.classList.add('show');
      }
    });

    // ── Error Banner ──
    const params = new URLSearchParams(window.location.search);
    const code = params.get('error');
    if (code) {
      const msgs = {
        email_exists: 'This email is already registered. Please login.',
        password_mismatch: 'Passwords do not match.',
        validation: 'Please fill in all fields correctly.',
        server_error: 'Something went wrong. Please try again.',
      };
      const banner = document.getElementById('errorMessage');
      banner.textContent = msgs[code] || 'An error occurred.';
      banner.classList.add('show');
    }
  </script>

</body>

</html>
